version: '3'

vars:
  PYTHON: .venv/bin/python

tasks:
  start:
    desc: Start both the server and ngrok in separate terminals
    cmds:
      - task: start:agent
        silent: true
      - task: ngrok
        silent: true
  
  start:agent:
    desc: Start the LangChain agent server
    cmds:
      - '{{.PYTHON}} src/glean_agent_examples/langchain/agent.py'
    
  install:
    desc: Install dependencies
    cmds:
      - uv pip install -e .
      
  ngrok:
    desc: Start ngrok tunnel to expose the LangChain agent server
    cmds:
      - ngrok http 8000    
        
  test:
    desc: Test the LangChain agent with a query
    cmds:
      - '{{.PYTHON}} tests/langchain/test_agent.py {{.CLI_ARGS}}'
    summary: |
      Test the LangChain agent with a query.
      
      Usage:
        task test -- "Your query here"
      
      Example:
        task test -- "What information can you find about AI in Glean?"
        
  interactive:
    desc: Start an interactive test session with the LangChain agent
    cmds:
      - '{{.PYTHON}} tests/langchain/test_interactive.py'
      
  curl:
    desc: Test the LangChain agent using curl
    cmds:
      - ./tests/langchain/curl_example.sh {{.CLI_ARGS}}
    summary: |
      Test the LangChain agent using curl.
      
      Usage:
        task curl -- "Your query here"
      
      Example:
        task curl -- "What information can you find about AI in Glean?"
